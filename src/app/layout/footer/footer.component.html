<footer class="site-footer" *ngIf="siteData()">
  <div class="footer-content">
    <div class="footer-col">
      <h2>{{ siteData()!.name }}</h2>
      <p>{{ siteData()!.speciality }}</p>
      <p>N° ADELI : {{ siteData()!.adeli }}</p>
    </div>

    <div class="footer-col">
      <p>📍 {{ siteData()!.address }}</p>
      <p>📞 {{ siteData()!.phone }}</p>
      <p>✉️ {{ siteData()!.email }}</p>
    </div>

    @if (mapUrl()) {
      <div class="footer-map">
        <iframe
          [src]="mapUrl()"
          width="100%"
          height="200"
          style="border:0; border-radius: 8px;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    }


  </div>

  <div class="footer-bottom">
    © {{ currentYear }} {{ siteData()!.name }} — Tous droits réservés
  </div>
</footer>
