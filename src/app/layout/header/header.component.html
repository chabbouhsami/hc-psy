@if (siteData()) {
  <div
    class="hero"
    [style.background-image]="'url(' + siteData()!.headerImageUrl + ')'"
  >
    <div class="overlay">
      <h1 class="name">{{ siteData()!.name }}</h1>
      <p class="speciality">{{ siteData()!.speciality }}</p>

      <div class="contact">
        <p>📞 {{ siteData()!.phone }}</p>
        <p>✉️ {{ siteData()!.email }}</p>
        <p>N° ADELI : {{ siteData()!.adeli }}</p>
      </div>

      <a routerLink="/prendre-rendez-vous" class="btn-rdv">
        Prendre rendez-vous
      </a>
    </div>
  </div>
}
